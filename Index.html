<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoAgro Tech - Sustentabilidade no Campo</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>
    <header>
        <h1>Agro Forte, Futuro Sustentável</h1>
        <p>Tecnologia a serviço do meio ambiente</p>
    </header>

    <main>
        <section class="calc-container">
            <h2>Simulador de Economia de Água</h2>
            <label for="cultura">Selecione a Cultura:</label>
            <select id="cultura">
                <option value="milho">Milho</option>
                <option value="tomate">Tomate</option>
                <option value="folhosas">Hortaliças/Folhosas</option>
            </select>

            <label for="area">Área do Plantio (em hectares):</label>
            <input type="number" id="area" placeholder="Ex: 5" min="1">

            <button onclick="calcularEconomia()">Calcular Impacto</button>

            <div id="resultado" class="hidden">
                </div>
        </section>
    </main>

    <script src="Script.js"></script>
</body>
</html>
